name: Release & Build Installers

# ─────────────────────────────────────────────────────────────────────────────
# دفع وسم v*  → بناء ويندوز + لينكس، توقيعهما، ثم نشر Release عام يحتوي:
#   المثبّتات (.exe / .msi / .deb / .rpm / .AppImage) + تواقيعها (.sig)
#   + latest.json — وهو الملف الذي يفحصه التطبيق ليعرض «يتوفر تحديث».
# تشغيل يدوي (workflow_dispatch) → بناء فقط ورفع Artifacts دون نشر Release.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            bundles: 'deb,rpm,appimage'
            artifact: 'linux-installers'
          - platform: 'windows-latest'
            bundles: 'msi,nsis'
            artifact: 'windows-installers'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # نشر إصدار حقيقي: Release + توقيع + latest.json (هذا ما يغذي التحديث التلقائي)
      - name: Build & publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Flashki ${{ github.ref_name }}'
          releaseBody: 'حمّل المثبّت المناسب لنظامك (ويندوز: ‎.exe/-setup أو ‎.msi — لينكس: ‎.AppImage أو ‎.deb أو ‎.rpm). أصحاب الإصدارات السابقة يحصلون على التحديث من داخل التطبيق: الإعدادات ← فحص التحديثات ← فحص الآن.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

      # تشغيل يدوي من تبويب Actions: بناء وتوقيع دون نشر — الناتج في Artifacts
      - name: Build only (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: true

      # نسخة احتياطية من المثبّتات كـ Artifacts باسم واضح (متاحة في صفحة الـ workflow)
      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
